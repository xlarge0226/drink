<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酒駕案件處置助手</title>
  <style>
    :root {
      --bg:#0f172a; --card:#1e293b; --card2:#162032; --inp:#0b1220;
      --txt:#f8fafc; --sub:#94a3b8; --bdr:#334155; --acc:#38bdf8;
      --acc-bg:rgba(56,189,248,.14); --red:#f87171; --red-bg:rgba(248,113,113,.14);
    }
    body.bright {
      --bg:#f1f5f9; --card:#fff; --card2:#f8fafc; --inp:#f1f5f9;
      --txt:#0f172a; --sub:#475569; --bdr:#cbd5e1; --acc:#0284c7;
      --acc-bg:rgba(2,132,199,.12); --red:#dc2626; --red-bg:rgba(220,38,38,.1);
    }
    *{box-sizing:border-box}
    body{margin:0;padding:0 0 80px;font-family:sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
    header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bdr)}
    .title{font-weight:700;font-size:1.05rem}
    .mode-btn{background:var(--acc-bg);color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer}
    main{max-width:720px;margin:0 auto;padding:12px}
    .page{display:none}.page.active{display:block}
    .card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:12px}
    .h{font-weight:700;font-size:1rem;margin-bottom:4px}
    .s{color:var(--acc);font-size:.82rem;margin-bottom:8px}
    .d{color:var(--sub);font-size:.9rem;margin-bottom:10px;white-space:pre-line}
    .choice{display:block;width:100%;text-align:left;background:var(--card2);color:var(--txt);border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
    .btn{background:var(--card2);color:var(--txt);border:1px solid var(--bdr);border-radius:8px;padding:7px 12px;font-size:.85rem;cursor:pointer;margin-right:6px}
    .pri{background:var(--acc);color:#082f49;border:none;font-weight:700}
    .copy{background:var(--acc-bg);color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:5px 10px;font-size:.8rem;cursor:pointer;float:right}
    .tpl{background:var(--inp);border:1px dashed var(--bdr);border-radius:8px;padding:10px;margin:8px 0;white-space:pre-line;font-size:.9rem}
    .chk{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--bdr);cursor:pointer}
    .chk:last-child{border-bottom:none}
    .inp{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--bdr);background:var(--inp);color:var(--txt);margin-bottom:10px}
    .timer{text-align:center;font-size:2.8rem;font-weight:800;color:var(--acc);margin:12px 0}
    #err{display:none;background:var(--red-bg);border:1px solid var(--red);border-radius:10px;padding:10px;margin-bottom:12px;font-size:.85rem;white-space:pre-line}
    nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--bdr);padding:6px 2px}
    .nb{background:none;border:none;color:var(--sub);font-size:.7rem;cursor:pointer;padding:4px 0}
    .nb.active{color:var(--acc);font-weight:700}
  </style>
</head>
<body>
  <header>
    <div class="title">酒駕案件處置助手</div>
    <button class="mode-btn" type="button" onclick="toggleMode()">明亮模式</button>
  </header>
  <main>
    <div id="err"></div>
    <section id="page-wizard" class="page active"><div id="wizard-container"></div></section>
    <section id="page-tickets" class="page"><div id="tickets-container"></div></section>
    <section id="page-notes" class="page"><div id="notes-container"></div></section>
    <section id="page-checklist" class="page"><div id="checklist-container"></div></section>
    <section id="page-laws" class="page">
      <div class="card"><div class="h">法令查詢</div><input id="law-q" class="inp" placeholder="搜尋法條或關鍵字..." oninput="renderLaws()" /></div>
      <div id="laws-container"></div>
    </section>
    <section id="page-timer" class="page">
      <div class="card">
        <div class="h">15 分鐘觀察／漱口計時</div>
        <div id="t-disp" class="timer">15:00</div>
        <div style="text-align:center">
          <button id="t-btn" class="btn pri" type="button" onclick="toggleTimer()">開始計時</button>
          <button class="btn" type="button" onclick="resetTimer(900)">重設 15 分鐘</button>
        </div>
      </div>
    </section>
  </main>
  <nav>
    <button class="nb active" data-p="wizard" onclick="go('wizard',this)">🧭<br>主畫面</button>
    <button class="nb" data-p="tickets" onclick="go('tickets',this)">🧾<br>罰單例稿</button>
    <button class="nb" data-p="notes" onclick="go('notes',this)">📝<br>筆錄範例</button>
    <button class="nb" data-p="checklist" onclick="go('checklist',this)">✅<br>卷宗檢核</button>
    <button class="nb" data-p="laws" onclick="go('laws',this)">⚖️<br>法令查詢</button>
    <button class="nb" data-p="timer" onclick="go('timer',this)">⏱️<br>15分計時</button>
  </nav>
      <script>
    window.addEventListener('error',function(e){var b=document.getElementById('err');if(b){b.style.display='block';b.textContent='錯誤：'+(e.message||'')+(e.lineno?' (第'+e.lineno+'行)':'');}});
  </script>
  <script src="./data.js" onload="if(typeof initApp==='function')initApp()" onerror="showDataErr()"></script>
  <script>
    var stepId='step_start', hist=[], inited=false, sec=900, iv=null, twoTicketsMode=false;
    function gd(){return window.DUI_DATA||(typeof DUI_DATA!=='undefined'?DUI_DATA:null);}
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function showDataErr(){var c=document.getElementById('wizard-container');if(c)c.innerHTML='<div class="card"><div class="h">讀取失敗</div><div class="d">無法載入 ./data.js</div></div>';}
    function toggleMode(){document.body.classList.toggle('bright');}
    function isTwoTicketsStep(n){return n==='verdict_2_tickets'||String(n||'').indexOf('res_2_')===0;}
    function go(p,el){
      document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active');});
      var t=document.getElementById('page-'+p);if(t)t.classList.add('active');
      document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('active');});
      if(el)el.classList.add('active');
      var d=gd();
      if(p==='tickets'&&d)renderTickets(d.tickets);
      if(p==='notes'&&d)renderCards('notes-container',d.notes,'尚無筆錄範例');
      if(p==='checklist'&&d)renderChecklist();
      if(p==='laws'&&d)renderLaws();
    }
    function cp(txt,btn){
      var ok=function(){if(!btn)return;var o=btn.textContent;btn.textContent='已複製 ✓';setTimeout(function(){btn.textContent=o;},1500);};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt||'').then(ok).catch(ok);}else{ok();}
    }
    function renderCards(id,arr,emptyMsg){
      var box=document.getElementById(id);if(!box)return;
      if(!Array.isArray(arr)||!arr.length){box.innerHTML='<div class="card"><div class="d">'+emptyMsg+'</div></div>';return;}
      box.innerHTML=arr.map(function(it){
        var t=it.template||'';
        return '<div class="card">'+(t?'<button class="copy" type="button" data-tpl="'+encodeURIComponent(t)+'" onclick="cp(decodeURIComponent(this.getAttribute(\'data-tpl\')),this)">複製範例</button>':'')+
          '<div class="h">'+esc(it.title)+'</div>'+(it.sub?'<div class="s">'+esc(it.sub)+'</div>':'')+
          (t?'<div class="tpl">'+esc(t)+'</div>':'')+
          (it.content||it.text?'<div class="d">'+esc(it.content||it.text)+'</div>':'')+
          (it.note?'<div class="d" style="font-size:.8rem;margin-bottom:0">'+esc(it.note)+'</div>':'')+'</div>';
      }).join('');
    }
    function renderTickets(arr){
      if(!Array.isArray(arr)){renderCards('tickets-container',[],'尚無罰單例稿');return;}
      var list=arr.slice();
      if(twoTicketsMode){
        list.sort(function(a,b){
          var a2=(a.id==='ticket_other_traffic'||String(a.title||'').indexOf('第 2 張')!==-1)?0:1;
          var b2=(b.id==='ticket_other_traffic'||String(b.title||'').indexOf('第 2 張')!==-1)?0:1;
          return a2-b2;
        });
      }
      renderCards('tickets-container',list,'尚無罰單例稿');
    }
    function renderWizard(){
      var d=gd(),box=document.getElementById('wizard-container');if(!box||!d||!d.steps)return;
      var st=d.steps[stepId]||d.steps[Object.keys(d.steps)[0]];if(!st)return;
      var html='<div class="card"><div class="h">'+esc(st.title)+'</div>'+(st.sub?'<div class="s">'+esc(st.sub)+'</div>':'')+(st.desc?'<div class="d">'+esc(st.desc)+'</div>':'');
      if(st.verdict)html+='<div class="tpl"><div class="h">'+esc(st.verdict)+'</div><div class="d" style="margin-bottom:0">'+esc(st.verdictDetail||'')+'</div></div>';
      if(Array.isArray(st.choices)){st.choices.forEach(function(c){html+='<button class="choice" type="button" onclick="pickStep(\''+esc(c.next||'')+'\')">'+esc(c.label)+'</button>';});}
      if(hist.length)html+='<button class="btn" type="button" onclick="backStep()">回上一步</button>';
      html+='<button class="btn" type="button" onclick="resetStep()">重新開始</button></div>';
      box.innerHTML=html;
    }
    function pickStep(n){
      var d=gd();
      if(n&&d&&d.steps&&d.steps[n]){
        hist.push(stepId);
        stepId=n;
        twoTicketsMode=isTwoTicketsStep(n);
        renderWizard();
        if(d.tickets)renderTickets(d.tickets);
      }
    }
    function backStep(){if(hist.length){stepId=hist.pop();twoTicketsMode=isTwoTicketsStep(stepId);renderWizard();}}
    function resetStep(){hist=[];twoTicketsMode=false;var d=gd();if(d&&d.steps)stepId=Object.keys(d.steps)[0];renderWizard();}
    function renderChecklist(){
      var d=gd(),box=document.getElementById('checklist-container');if(!box)return;
      if(!d||!Array.isArray(d.checklist)||!d.checklist.length){box.innerHTML='<div class="card"><div class="d">尚無檢核項目</div></div>';return;}
      box.innerHTML='<div class="card">'+d.checklist.map(function(c){
        var ttl=typeof c==='string'?c:(c.title||c.label||'');
        return '<label class="chk"><input type="checkbox"'+(c.checked?' checked':'')+' /><div><div style="font-weight:600">'+esc(ttl)+'</div>'+(c.detail?'<div class="d" style="margin:0">'+esc(c.detail)+'</div>':'')+'</div></label>';
      }).join('')+'</div>';
    }
    function renderLaws(){
      var d=gd(),box=document.getElementById('laws-container');if(!box)return;
      if(!d||!Array.isArray(d.laws)||!d.laws.length){box.innerHTML='<div class="card"><div class="d">尚無法令資料</div></div>';return;}
      var q=(document.getElementById('law-q')?document.getElementById('law-q').value:'').trim().toLowerCase();
      var list=d.laws.filter(function(l){return !q||((l.title||'')+' '+(l.sub||'')+' '+(l.content||l.text||'')).toLowerCase().indexOf(q)!==-1;});
      renderCards('laws-container',list,'查無符合條文');
    }
    function showT(){var m=Math.floor(Math.max(0,sec)/60),r=Math.max(0,sec)%60,el=document.getElementById('t-disp');if(el)el.textContent=(m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
    function toggleTimer(){
      var b=document.getElementById('t-btn');
      if(iv){clearInterval(iv);iv=null;if(b)b.textContent='繼續計時';return;}
      if(sec<=0)sec=900;if(b)b.textContent='暫停計時';
      iv=setInterval(function(){sec--;showT();if(sec<=0){clearInterval(iv);iv=null;if(b)b.textContent='開始計時';}},1000);
    }
    function resetTimer(n){if(iv){clearInterval(iv);iv=null;}sec=n;showT();var b=document.getElementById('t-btn');if(b)b.textContent='開始計時';}
    function initApp(){
      if(inited)return;var d=gd();if(!d)return showDataErr();inited=true;
      renderWizard();renderTickets(d.tickets);renderCards('notes-container',d.notes,'尚無筆錄範例');
      renderChecklist();renderLaws();showT();
    }
    document.addEventListener('DOMContentLoaded',function(){if(gd())initApp();});
  </script>

</body>
</html>
