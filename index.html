<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>酒駕案件處理與舉發助手</title>
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-card: #151c28;
      --bg-card-hover: #1e2738;
      --bg-nav: #111622;
      --border: #2a3548;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.15);
      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.15);
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      line-height: 1.6;
      padding-bottom: 84px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 15, 23, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-primary);
    }

    .badge-top {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    .tab-section {
      display: none;
    }
    .tab-section.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .crumb-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .step-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .step-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #1a2232;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover, .option-btn:active {
      background: var(--bg-card-hover);
      border-color: var(--accent);
    }

    .option-btn .opt-title {
      font-size: 1rem;
      font-weight: 600;
      display: block;
      margin-bottom: 3px;
    }

    .option-btn .opt-sub {
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: block;
    }

    .check-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #1a2232;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      cursor: pointer;
    }
    .check-option input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .btn-primary {
      background: var(--accent);
      color: #06101d;
      border-color: var(--accent);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
    }

    .verdict-box {
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid;
    }
    .verdict-danger {
      background: var(--danger-soft);
      border-color: rgba(248, 113, 113, 0.4);
    }
    .verdict-warning {
      background: var(--warning-soft);
      border-color: rgba(251, 191, 36, 0.4);
    }
    .verdict-success {
      background: var(--success-soft);
      border-color: rgba(52, 211, 153, 0.4);
    }
    .verdict-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .verdict-main {
      font-size: 1.08rem;
      font-weight: 700;
    }

    .detail-list {
      list-style: none;
      margin-top: 10px;
    }
    .detail-list li {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }
    .detail-list li:last-child {
      border-bottom: none;
    }

    .ticket-box {
      background: #0d121c;
      border: 1px dashed #3b4a63;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.92rem;
      margin: 10px 0;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    .copy-btn {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .timer-display {
      font-size: 3.4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: center;
      margin: 20px 0;
      color: var(--accent);
      letter-spacing: 2px;
    }
    .timer-display.done {
      color: var(--success);
    }

    .search-input {
      width: 100%;
      background: #1a2232;
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: var(--bg-nav);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 30;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      position: relative;
    }

    .nav-btn.active {
      color: var(--accent);
      font-weight: 700;
    }

    .nav-icon {
      font-size: 1.2rem;
      line-height: 1;
    }

    .timer-dot {
      position: absolute;
      top: 10px;
      right: 24%;
      width: 8px;
      height: 8px;
      background: var(--warning);
      border-radius: 50%;
      display: none;
    }
    .timer-dot.running {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>酒駕案件處置助手</h1>
    <span class="badge-top">Dark Field Mode</span>
  </header>

  <main>
    <section id="tab-home" class="tab-section active">
      <div id="breadcrumb" class="breadcrumb"></div>
      <div id="wizard-container"></div>
    </section>

    <section id="tab-tickets" class="tab-section">
      <div class="card">
        <div class="step-title">舉發違反道路交通管理事件例稿</div>
        <div class="step-desc">點擊複製即可貼入警用行動載具（M-Police）或填單參考，請依現場實際人車與數值修改括號內容。</div>
      </div>
      <div id="tickets-container"></div>
    </section>

    <section id="tab-checklist" class="tab-section">
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div class="step-title">移送與舉發卷宗檢核</div>
          <div class="step-desc" style="margin-bottom:0;">自動記憶勾選進度</div>
        </div>
        <button class="btn-secondary" style="padding:6px 12px; border-radius:8px; font-size:0.8rem;" onclick="resetChecklist()">重置</button>
      </div>
      <div id="checklist-container"></div>
    </section>

    <section id="tab-laws" class="tab-section">
      <input type="text" id="law-search" class="search-input" placeholder="搜尋關鍵字（例如：35條、185-3、拒測、連坐、微電車、扣牌）..." oninput="renderLaws(this.value)" />
      <div id="laws-container"></div>
    </section>

    <section id="tab-timer" class="tab-section">
      <div class="card">
        <div class="step-title">飲酒結束／漱口 15 分鐘計時器</div>
        <div class="step-desc">依取締酒後駕車作業程序，受測人飲酒結束或漱口後須滿 15 分鐘始得進行吐氣酒精濃度測試。</div>
        <div id="timer-display" class="timer-display">15:00</div>
        <div id="timer-status" style="text-align:center; color:var(--text-secondary); font-size:0.9rem; margin-bottom:16px;">尚未開始計時</div>
        <div class="btn-row">
          <button id="timer-toggle-btn" class="btn btn-primary" onclick="toggleTimer()">開始計時</button>
          <button class="btn btn-secondary" onclick="resetTimer()">重設 15 分</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="tab-home" onclick="switchTab('tab-home', this)">
      <span class="nav-icon">🧭</span>
      <span>主畫面</span>
    </button>
    <button class="nav-btn" data-tab="tab-tickets" onclick="switchTab('tab-tickets', this)">
      <span class="nav-icon">📝</span>
      <span>罰單例稿</span>
    </button>
    <button class="nav-btn" data-tab="tab-checklist" onclick="switchTab('tab-checklist', this)">
      <span class="nav-icon">☑️</span>
      <span>卷宗檢核</span>
    </button>
    <button class="nav-btn" data-tab="tab-laws" onclick="switchTab('tab-laws', this)">
      <span class="nav-icon">⚖️</span>
      <span>法令查詢</span>
    </button>
    <button class="nav-btn" data-tab="tab-timer" onclick="switchTab('tab-timer', this)">
      <span class="timer-dot" id="nav-timer-dot"></span>
      <span class="nav-icon">⏱️</span>
      <span>15分計時</span>
    </button>
  </nav>

  <script src="./data.js" onload="initApp()" onerror="showDataError()"></script>
  <script>
    let historyStack = [];
    let currentStepId = 'step_road';
    let answers = {};

    function getData() {
      return window.DUI_DATA || (typeof DUI_DATA !== 'undefined' ? DUI_DATA : null);
    }

    function showDataError() {
      const container = document.getElementById('wizard-container');
      if (container) {
        container.innerHTML = `
          <div class="card verdict-box verdict-danger">
            <div class="verdict-label">檔案連結失敗</div>
            <div class="verdict-main">找不到或無法讀取 ./data.js</div>
            <div style="font-size:0.88rem; margin-top:6px;">
              請確認：1. 專案根目錄有 <code>data.js</code>（全小寫）；2. <code>data.js</code> 沒有語法錯誤。
            </div>
          </div>
        `;
      }
    }

    function switchTab(tabId, btnEl) {
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');

      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if (btnEl) {
        btnEl.classList.add('active');
      } else {
        const targetBtn = document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
        if (targetBtn) targetBtn.classList.add('active');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderWizard() {
      const data = getData();
      if (!data) return showDataError();

      const container = document.getElementById('wizard-container');
      const bc = document.getElementById('breadcrumb');
      bc.innerHTML = historyStack.map(h => `<span class="crumb-item">${h.label}</span>`).join('');

      if (currentStepId === 'RESULT') {
        const result = data.evaluateCase(answers);
        container.innerHTML = `
          <div class="card">
            <div class="step-title">案件處置與舉發判定結果</div>
            <div class="step-desc">依據上述現場條件綜合判斷：</div>

            <div class="verdict-box ${result.criminalClass}">
              <div class="verdict-label">刑事移送判斷（刑法第 185-3 條）</div>
              <div class="verdict-main">${result.criminalTitle}</div>
              <div style="font-size:0.88rem; margin-top:4px;">${result.criminalDesc}</div>
            </div>

            <div class="verdict-box ${result.adminClass}">
              <div class="verdict-label">行政舉發罰單（道路交通管理處罰條例）</div>
              <div class="verdict-main">${result.adminTitle}</div>
              <div style="font-size:0.88rem; margin-top:4px;">${result.adminDesc}</div>
            </div>

            <div style="font-weight:700; margin-top:14px; font-size:0.95rem;">現場即時處置與附帶處分：</div>
            <ul class="detail-list">
              ${result.actions.map(act => `<li>• ${act}</li>`).join('')}
            </ul>

            <div class="btn-row">
              <button class="btn btn-secondary" onclick="goBack()">← 上一步</button>
              <button class="btn btn-primary" onclick="jumpToTicket('${result.recommendedTicketId || ''}')">查看對應罰單例稿</button>
            </div>
            <div class="btn-row" style="margin-top:8px;">
              <button class="btn btn-secondary" onclick="restartWizard()">重新評估新案件</button>
            </div>
          </div>
        `;
        return;
      }

      const step = data.steps[currentStepId];
      if (!step) return;

      if (step.type === 'multi') {
        container.innerHTML = `
          <div class="card">
            <div class="step-title">${step.title}</div>
            <div class="step-desc">${step.desc}</div>
            <div class="option-list">
              ${step.options.map(opt => `
                <label class="check-option">
                  <input type="checkbox" name="multi_opt" value="${opt.value}" />
                  <div>
                    <span class="opt-title">${opt.title}</span>
                    <span class="opt-sub">${opt.sub || ''}</span>
                  </div>
                </label>
              `).join('')}
            </div>
            <div class="btn-row">
              ${historyStack.length > 0 ? `<button class="btn btn-secondary" onclick="goBack()">← 上一步</button>` : ''}
              <button class="btn btn-primary" onclick="submitMultiStep('${step.key}', '${step.next}')">產出處置與罰單判定</button>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="card">
          <div class="step-title">${step.title}</div>
          <div class="step-desc">${step.desc}</div>
          <div class="option-list">
            ${step.options.map(opt => `
              <button class="option-btn" onclick="selectOption('${step.key}', '${opt.value}', '${opt.title}', '${opt.next}')">
                <span class="opt-title">${opt.title}</span>
                ${opt.sub ? `<span class="opt-sub">${opt.sub}</span>` : ''}
              </button>
            `).join('')}
          </div>
          ${historyStack.length > 0 ? `
            <div class="btn-row">
              <button class="btn btn-secondary" onclick="goBack()">← 返回上一步</button>
              <button class="btn btn-secondary" onclick="restartWizard()">重新開始</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function selectOption(key, value, label, nextStepId) {
      historyStack.push({ stepId: currentStepId, key, label });
      answers[key] = value;
      currentStepId = nextStepId;
      renderWizard();
    }

    function submitMultiStep(key, nextStepId) {
      const checked = Array.from(document.querySelectorAll('input[name="multi_opt"]:checked')).map(el => el.value);
      historyStack.push({ stepId: currentStepId, key, label: checked.length ? `加重條件(${checked.length}項)` : '無加重條件' });
      answers[key] = checked;
      currentStepId = nextStepId;
      renderWizard();
    }

    function goBack() {
      if (historyStack.length === 0) return;
      const prev = historyStack.pop();
      delete answers[prev.key];
      currentStepId = prev.stepId;
      renderWizard();
    }

    function restartWizard() {
      historyStack = [];
      answers = {};
      currentStepId = 'step_road';
      renderWizard();
    }

    function jumpToTicket(ticketId) {
      switchTab('tab-tickets');
      if (ticketId) {
        const el = document.getElementById('ticket-' + ticketId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function renderTickets() {
      const data = getData();
      if (!data) return;
      const container = document.getElementById('tickets-container');
      container.innerHTML = data.tickets.map(t => `
        <div class="card" id="ticket-${t.id}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div>
              <div class="step-title" style="font-size:1.05rem;">${t.title}</div>
              <div style="font-size:0.82rem; color:var(--accent);">${t.article} ｜ 罰鍰：${t.fine}</div>
            </div>
            <button class="copy-btn" onclick="copyText(\`${t.template.replace(/`/g, '\\`')}\`, this)">複製例稿</button>
          </div>
          <div class="ticket-box">${t.template}</div>
          <div style="font-size:0.82rem; color:var(--text-secondary);">備註：${t.note}</div>
        </div>
      `).join('');
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '已複製 ✓';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    function renderChecklist() {
      const data = getData();
      if (!data) return;
      const saved = JSON.parse(localStorage.getItem('dui_checklist_v1') || '{}');
      const container = document.getElementById('checklist-container');
      container.innerHTML = data.checklists.map((group, gIdx) => `
        <div class="card">
          <div class="step-title" style="font-size:1.02rem; margin-bottom:10px; color:var(--accent);">${group.category}</div>
          <div class="option-list">
            ${group.items.map((item, iIdx) => {
              const id = `chk_${gIdx}_${iIdx}`;
              const isChecked = !!saved[id];
              return `
                <label class="check-option">
                  <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheckItem('${id}', this.checked)" />
                  <div>
                    <span class="opt-title" style="font-size:0.95rem;">${item.title}</span>
                    ${item.sub ? `<span class="opt-sub">${item.sub}</span>` : ''}
                  </div>
                </label>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    function toggleCheckItem(id, checked) {
      const saved = JSON.parse(localStorage.getItem('dui_checklist_v1') || '{}');
      saved[id] = checked;
      localStorage.setItem('dui_checklist_v1', JSON.stringify(saved));
    }

    function resetChecklist() {
      localStorage.removeItem('dui_checklist_v1');
      renderChecklist();
    }

    function renderLaws(keyword = '') {
      const data = getData();
      if (!data) return;
      const kw = keyword.trim().toLowerCase();
      const filtered = data.laws.filter(law =>
        !kw ||
        law.title.toLowerCase().includes(kw) ||
        law.tags.toLowerCase().includes(kw) ||
        law.content.toLowerCase().includes(kw)
      );
      const container = document.getElementById('laws-container');
      container.innerHTML = filtered.map(law => `
        <div class="card">
          <div class="step-title" style="font-size:1.02rem; color:var(--accent);">${law.title}</div>
          <div style="font-size:0.78rem; color:var(--warning); margin-bottom:8px;">關鍵標籤：${law.tags}</div>
          <div style="font-size:0.9rem; white-space:pre-line; color:var(--text-primary);">${law.content}</div>
        </div>
      `).join('') || `<div class="card" style="text-align:center; color:var(--text-secondary);">查無相符法條內容</div>`;
    }

    let timerSeconds = 15 * 60;
    let timerInterval = null;

    function updateTimerUI() {
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      const display = document.getElementById('timer-display');
      display.textContent = `${mins}:${secs}`;
      if (timerSeconds === 0) {
        display.classList.add('done');
        document.getElementById('timer-status').textContent = '已滿 15 分鐘，可進行酒測！';
      } else {
        display.classList.remove('done');
      }
    }

    function toggleTimer() {
      const btn = document.getElementById('timer-toggle-btn');
      const dot = document.getElementById('nav-timer-dot');
      const status = document.getElementById('timer-status');

      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.textContent = '繼續計時';
        dot.classList.remove('running');
        status.textContent = '計時已暫停';
      } else {
        if (timerSeconds === 0) timerSeconds = 15 * 60;
        btn.textContent = '暫停計時';
        dot.classList.add('running');
        status.textContent = '計時中...（切換其他分頁仍會持續倒數）';
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerUI();
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.textContent = '重新計時';
            dot.classList.remove('running');
            if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerSeconds = 15 * 60;
      document.getElementById('timer-toggle-btn').textContent = '開始計時';
      document.getElementById('nav-timer-dot').classList.remove('running');
      document.getElementById('timer-status').textContent = '已重設為 15 分鐘';
      updateTimerUI();
    }

    function initApp() {
      renderWizard();
      renderTickets();
      renderChecklist();
      renderLaws();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (getData()) initApp();
    });
  </script>
</body>
</html>
