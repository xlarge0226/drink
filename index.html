<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酒駕案件處置助手</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .box {
      max-width: 720px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
    }
    .ok {
      color: #4ade80;
      font-weight: bold;
    }
    pre {
      white-space: pre-wrap;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>酒駕案件處置助手（測試畫面）</h2>
    <p id="status">正在檢查 data.js ...</p>
    <pre id="debug"></pre>
  </div>
  <script src="data.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const debugEl = document.getElementById('debug');
    if (window.DUI_DATA) {
      statusEl.innerHTML = '<span class="ok">✓ 畫面正常顯示，且 data.js 已成功載入！</span>';
      debugEl.textContent = JSON.stringify({
        stepsCount: Object.keys(window.DUI_DATA.steps || {}).length,
        ticketsCount: (window.DUI_DATA.tickets || []).length,
        notesCount: (window.DUI_DATA.notes || []).length,
        checklistsCount: (window.DUI_DATA.checklists || []).length,
        lawsCount: (window.DUI_DATA.laws || []).length
      }, null, 2);
    } else {
      statusEl.textContent = '✗ 畫面有顯示，但 window.DUI_DATA 沒有載入（代表 data.js 仍有語法錯或檔名／路徑不對）。';
    }
  </script>
</body>
</html>
